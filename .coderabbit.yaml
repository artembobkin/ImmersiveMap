# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Configuration reference: https://docs.coderabbit.ai/reference/configuration

language: en-US
tone_instructions: >-
  Be direct and concise. Prioritize correctness, concurrency safety and public
  API stability over style. Skip praise. Never use an em dash.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: true
  poem: false

  path_filters:
    - "!**/*.pbxproj"
    - "!**/*.xcworkspacedata"
    - "!**/*.xcscheme"
    - "!**/Package.resolved"
    - "!**/*.png"
    - "!**/*.usdz"
    - "!CHANGELOG.md"
    - "!ImmersiveMap/Generated/**"

  path_instructions:
    - path: "ImmersiveMap/**/*.swift"
      instructions: >-
        Swift 6 language mode with strict concurrency. There are no Swift actors
        in this package: the frame engine and every UI runtime are main thread
        (ImmersiveMapRuntimeGraph is @MainActor), and tile loading runs in Tasks
        off the main thread with mutable state serialized by plain DispatchQueues.
        Flag data races, missing @MainActor isolation, and Sendable violations.

        Enforce the inward layering rule: UI depends on Render, Render depends on
        the domain folders (Camera, Tile, Labels, Text, Presentation, Globe,
        EarthScene, Avatars, Starfield, Geo), and those depend on Utils. Domain
        folders must not import or reference UI or Render and must not contain
        Metal code. Render must not contain networking or platform UI. Provider
        specific MVT schema logic belongs only in VectorTileAdaptation and the
        concrete folders under Provider.

        Rendering is on demand. Any state change that should redraw must either
        request a frame (requestFrame(reason:)) or register an activity with
        RenderLoopPacing, otherwise the screen silently will not update. Flag
        state mutations that do neither.

        Every hand written file must start with the two line MIT copyright header
        (Copyright (c) 2025-2026 ImmersiveMap contributors. / SPDX-License-Identifier: MIT).

        Naming: ...State for value like state, ...Controller for command and
        interaction coordination, ...Resolver for deterministic input to output
        conversion, ...Runtime for long lived wiring, ...Math for stateless
        calculations. Flag Manager, Helper and Service suffixes.

        This is a public Swift Package, so treat changes to public types, the
        ImmersiveMapView builder modifiers and the public controllers as API
        surface changes and call them out. Backward compatibility shims are not
        wanted: when an API is replaced, the old one should be removed rather
        than deprecated.

        Never use targetEnvironment(macCatalyst); platform specific code is
        guarded by #if canImport(UIKit) or #if os(macOS).

        Providers and styles expose a configurationFingerprint (FNV-1a) that
        drives disk cache identity. Flag any change to provider configuration
        that does not change the fingerprint.

        Many files carry Russian language doc comments. That is intentional:
        match the surrounding file rather than asking for translation.

        Never use an em dash in code, comments or documentation.

    - path: "ImmersiveMap/**/*.metal"
      instructions: >-
        Metal shaders. Check coordinate space and precision assumptions, that
        globe and flat morphing stays continuous rather than hard switching, and
        that buffer indices match the Swift side. Every new .metal file must be
        registered under resources: in Package.swift, otherwise it silently does
        not ship.

    - path: "Tests/**/*.swift"
      instructions: >-
        XCTest suites. swift test runs natively on macOS but cannot compile
        .metal shaders, so tests that need a compiled Metal library must skip
        themselves rather than fail. Flag timing dependent assertions, sleeps and
        anything else likely to be flaky in CI.

    - path: "Package.swift"
      instructions: >-
        Every new .metal file or resource directory must be added under
        resources:, and every new in source README.md must be added to exclude:.
        Missing either breaks the build or silently drops the resource.

    - path: "**/*.md"
      instructions: >-
        Never use an em dash. Do not request changes to README.md unless the pull
        request already touches it.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
