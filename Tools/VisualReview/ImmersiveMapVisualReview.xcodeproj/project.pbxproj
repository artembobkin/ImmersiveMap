			shellScript = "# Two facts the generated Info.plist cannot carry.\n#\n# The commit records which checkout this build came from, so a verdict\n# made on a device says what it judged: there is no git on the phone to\n# ask later. UIFileSharingEnabled puts the renders and the verdict file in\n# the Files app, a second way off the device besides the share sheet, and\n# is not one of the keys an INFOPLIST_KEY_ setting can express.\n#\n# The built plist is declared as this phase's input on purpose: it is what\n# orders the phase after the task that generates it. Without that the\n# phase ran first and every key written here was overwritten.\nPLIST=\"$TARGET_BUILD_DIR/$INFOPLIST_PATH\"\n[ -f \"$PLIST\" ] || exit 1\n\nset_key() {\n  if ! /usr/libexec/PlistBuddy -c \"Set :$1 $3\" \"$PLIST\" 2>/dev/null; then\n    /usr/libexec/PlistBuddy -c \"Add :$1 $2 $3\" \"$PLIST\"\n  fi\n}\n\nCOMMIT=$(git -C \"$SRCROOT\" rev-parse --short HEAD 2>/dev/null || true)\nif [ -n \"$COMMIT\" ]; then set_key ImmersiveMapCommit string \"$COMMIT\"; fi\nset_key UIFileSharingEnabled bool true\n\nmkdir -p \"$DERIVED_FILE_DIR\"\ntouch \"$DERIVED_FILE_DIR/info-plist-stamp\"\n";
