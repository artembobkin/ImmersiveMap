name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Resolve run mode
        id: mode
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # GitHub withholds secrets from a pull request opened from a fork, so
          # the review cannot run there and the branch needs a review by hand.
          # Drafts are skipped to save review quota; marking one ready for
          # review triggers a full run.
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork" >> "$GITHUB_OUTPUT"
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=draft" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.mode.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review
        id: review
        if: steps.mode.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          # The procedure lives here rather than in a repository skill on
          # purpose: the action replaces `.claude/` with the base branch copy
          # before the CLI starts, and tag mode wraps this input in
          # <custom_instructions>, where a leading slash never expands into a
          # command. It is a port of the `code-review` plugin from the
          # `claude-code-plugins` marketplace, adapted to end in a verdict.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }} and return the merge verdict.

            Assumptions that apply to you and to every subagent you launch:
            every tool works, so do not test one and do not make exploratory
            calls; call a tool only when the task needs it; write in English and
            never use an em dash.

            Create a todo list, then follow these steps precisely.

            1. Read the pull request. Take the title and the description from
               `gh pr view`, and the changes from
               `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.
               Review the current diff even when Claude has commented on this
               pull request before: this check reports a fresh verdict on every
               head commit.

            2. Launch a haiku agent that returns the file paths, not the
               contents, of the rules that govern the change: the root
               CLAUDE.md, any CLAUDE.md in a directory holding a modified file,
               and the README.md of every touched folder under ImmersiveMap,
               because those carry hard "Responsibilities / Must Not Contain"
               boundary rules.

            3. Launch a sonnet agent that returns a summary of the changes.

            4. Launch four agents in parallel, each given the pull request title
               and description. Each returns a list of issues, and each issue
               carries a description, a file:line location and the reason it was
               flagged, such as "CLAUDE.md adherence" or "bug".

               - Agents 1 and 2, sonnet: audit the changes against the rule
                 files from step 2. When judging a file, weigh only the rule
                 files on its path or above it.
               - Agent 3, opus: scan the diff itself for obvious bugs without
                 pulling in outside context, and skip anything that cannot be
                 judged from the diff alone.
               - Agent 4, opus: look for defects in the introduced code:
                 incorrect logic, a data race, a missing @MainActor isolation, a
                 Sendable violation, a state change that redraws nothing because
                 it neither requests a frame nor registers an activity with
                 RenderLoopPacing, a new .metal file or resource directory
                 missing from `resources:` in Package.swift, a new in source
                 README.md missing from `exclude:`, an unintended break of the
                 public API surface, a hand written file without the two line
                 copyright header, or a credential committed to this public
                 repository.

               Only high signal issues count. Flag an issue when the code fails
               to compile or parse, when it produces a wrong result regardless
               of input, or when it clearly violates a rule you can quote from a
               CLAUDE.md or a folder README.md. Do not flag style preferences,
               issues that depend on a particular input or state, or subjective
               suggestions. When you are not certain an issue is real, drop it:
               a false positive erodes trust and costs the author a round trip.

            5. Launch one validator subagent per issue, in parallel, each given
               the pull request title, the description and the issue. Its job is
               to confirm with high confidence that the issue is real, for
               example that the variable really is undefined, or that the quoted
               rule governs this file and the change really breaks it. Use opus
               validators for bugs and logic, sonnet validators for rule
               violations.

            6. Drop every issue a validator did not confirm, and drop these even
               when confirmed: a pre-existing issue this pull request does not
               introduce, something that looks wrong but is correct, a pedantic
               nitpick a senior engineer would not raise, an issue a linter
               catches, a general quality concern such as thin test coverage
               unless a rule demands it, and an issue the code explicitly
               silences.

            7. Post one inline comment per surviving finding with
               mcp__github_inline_comment__create_inline_comment and
               `confirmed: true`, never a duplicate. Describe the issue briefly
               and cite the rule it breaks. Include a committable suggestion
               only when committing it fixes the issue completely; for a fix of
               six lines or more, a structural change, or a change spanning
               several locations, describe it instead. When linking to code, use
               the full commit sha in the form
               https://github.com/owner/repo/blob/<full sha>/<path>#L4-L7,
               centred on the line you discuss, since a shell substitution does
               not render in markdown.

            8. Finish with the structured verdict: `request_changes` when at
               least one finding survived step 6, `approve` when none did, and
               `blocking_findings` holding exactly the survivors. The summary
               says what was checked and what stands. Keep the dropped issues
               out of the verdict, they are noise on the report.
          claude_args: |
            --model opus
            --max-turns 120
            --allowedTools "Task,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"},"blocking_findings":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"file":{"type":"string"},"line":{"type":"integer"},"issue":{"type":"string"}},"required":["file","line","issue"]}}},"required":["verdict","summary","blocking_findings"]}'

      - name: Enforce the verdict
        if: steps.mode.outputs.run == 'true'
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::The review returned no verdict. Re-run this job to get one."
            exit 1
          fi

          verdict=$(printf '%s' "$RESULT" | jq -r '.verdict')
          findings=$(printf '%s' "$RESULT" | jq '.blocking_findings | length')
          {
            echo "### Claude review: $verdict"
            echo
            printf '%s' "$RESULT" | jq -r '.summary'
            echo
            printf '%s' "$RESULT" | jq -r '.blocking_findings[]? | "- `\(.file):\(.line)` \(.issue)"'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" != "approve" ]; then
            echo "::error::Claude requested changes. Address the findings and push again."
            exit 1
          fi

          if [ "$findings" != "0" ]; then
            echo "::error::The verdict approves the pull request while listing $findings blocking findings, so the check fails."
            exit 1
          fi

      - name: Report the skipped review
        if: steps.mode.outputs.run != 'true'
        env:
          REASON: ${{ steps.mode.outputs.reason }}
        run: |
          if [ "$REASON" = "fork" ]; then
            echo "::warning::A pull request from a fork gets no repository secrets, so Claude did not review it. Review this branch by hand before merging."
          else
            echo "Draft pull request, so the review is deferred until it is marked ready for review."
          fi
